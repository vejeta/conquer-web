# Default configuration for local development
# For VPS deployment, use: docker-compose -f docker-compose.vps.yml

services:
  conquer:
    build:
      context: ./conquer
    container_name: conquer-local
    environment:
      - TTYD_USERNAME=${TTYD_USERNAME:-user}
      - TTYD_PASSWORD=${TTYD_PASSWORD:-changeme}
      - MAX_CLIENTS=${MAX_CLIENTS:-5}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-1800}
      - TTYD_FONT_SIZE=${TTYD_FONT_SIZE:-16}
      - TZ=${TZ:-UTC}
      - TURN_SCHEDULE=${TURN_SCHEDULE:-0 20 * * 0}
      - TURN_SCHEDULE_LABEL=${TURN_SCHEDULE_LABEL:-Weekly, Sundays at 20:00 UTC}
      - TURN_RETRY_MINUTES=${TURN_RETRY_MINUTES:-10}
      - TURN_MAX_RETRIES=${TURN_MAX_RETRIES:-18}
      - ADMIN_CONTACT=${ADMIN_CONTACT:-}
    volumes:
      # Live world data: persists across rebuilds, seeded on first start
      - ./data/lib:/opt/conquer/lib
      # Public game status (status.json) served by Apache under /status/
      - ${STATUS_DIR:-./data/public}:/opt/conquer/public
    restart: unless-stopped

  apache:
    build:
      context: ./apache
    container_name: apache-local
    volumes:
      # Public landing page
      - ./web:/usr/local/apache2/htdocs:ro
      - ./data/public:/usr/local/apache2/status:ro
      - ./apache/certs/live:/usr/local/apache2/conf/certs/live:rw
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - conquer
    restart: unless-stopped
