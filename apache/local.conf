# Load required modules
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

# Lighter rate limiting for local development
# Enable logging for monitoring
LoadModule log_config_module modules/mod_log_config.so

# Basic logging (lighter for development)
LogFormat "%h %t \"%r\" %>s" simple
CustomLog /usr/local/apache2/logs/access.log simple

# Minimal rate limiting for local development
RewriteEngine On

# Listen on HTTPS
Listen 443
ServerName conquer.local

# HTTP -> HTTPS redirect
<VirtualHost *:80>
    ServerName conquer.local
    Redirect permanent / https://conquer.local/
</VirtualHost>

# HTTPS virtual host for local development
<VirtualHost *:443>
    ServerName conquer.local

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/certs/live/conquer.local/fullchain.pem"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/live/conquer.local/privkey.pem"

    # Allow self-signed certificates in development
    SSLVerifyClient none
    SSLVerifyDepth 0

    # Enable rewrite engine
    RewriteEngine on

    # API routes go to backend
    ProxyPreserveHost On
    ProxyPass /api http://conquer-backend:3000/api
    ProxyPassReverse /api http://conquer-backend:3000/api

    # WebSocket upgrade handling for game terminal
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/play/(.*) "ws://conquer-local:7681/$1" [P,L]

    # Game terminal route
    ProxyPass /play http://conquer-local:7681/
    ProxyPassReverse /play http://conquer-local:7681/
    ProxyTimeout 3600

    # Frontend routes (everything else) go to backend which serves static files
    ProxyPass / http://conquer-backend:3000/
    ProxyPassReverse / http://conquer-backend:3000/
</VirtualHost>