# Load required modules
LoadModule ssl_module modules/mod_ssl.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule rewrite_module modules/mod_rewrite.so

# Listen on HTTPS
Listen 443
ServerName conquer.local

# HTTP -> HTTPS redirect
<VirtualHost *:80>
    ServerName conquer.local
    Redirect permanent / https://conquer.local/
</VirtualHost>

# HTTPS virtual host
<VirtualHost *:443>
    ServerName conquer.local

    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/certs/live/conquer.local/fullchain.pem"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/live/conquer.local/privkey.pem"

    # Landing page (static, public)
    DocumentRoot "/usr/local/apache2/htdocs"

    # Public game status written by the game container
    Alias /status/ "/usr/local/apache2/status/"
    <Directory "/usr/local/apache2/status">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    # Game terminal: ttyd runs with base path /play
    RedirectMatch permanent ^/play$ /play/

    # Enable rewrite engine for WebSocket upgrade
    RewriteEngine on

    # WebSocket upgrade handling
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/play/(.*) "ws://conquer:7681/play/$1" [P,L]

    # Regular HTTP proxy
    ProxyPreserveHost On
    ProxyPass /play/ http://conquer:7681/play/
    ProxyPassReverse /play/ http://conquer:7681/play/

    # WebSocket proxy settings
    ProxyTimeout 3600
</VirtualHost>
