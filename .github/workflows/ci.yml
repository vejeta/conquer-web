name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Nightly: the full end-to-end rehearsal (the e2e job: 25 turns, 30 sessions)
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck -S warning -x -P conquer/scripts ./*.sh conquer/scripts/*.sh conquer/i18n/*.sh

      - name: Translations
        run: python3 tools/check-i18n.py

      - name: Tests (coach, narration, translations)
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -m "not browser and not game"

      - name: Game password check is the last <Location> in the Apache configs
        run: |
          for f in apache/local.conf vps/virtualhost.conf.template; do
            awk '/<Location "\/play\/">/ { seen = 1; next }
                 seen && /<Location/ { print FILENAME ": <Location> after /play/: " $0; bad = 1 }
                 END { exit bad }' "$f"
          done

      - name: Dockerfile checks
        run: |
          docker build --check ./conquer
          docker build --check ./apache

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Chromium for the browser tests
        run: |
          python3 -m pip install --quiet pytest playwright
          python3 -m playwright install --with-deps chromium

      - name: Tests in the browser (coach, key bar, terminal size, sign-up video)
        run: python3 -m pytest -m browser

  smoke:
    needs: lint
    runs-on: ubuntu-latest
    env:
      TTYD_USERNAME: ci
      TTYD_PASSWORD: ci-password
      TURN_SCHEDULE: "off"
      TURN_SCHEDULE_LABEL: "Weekly, Sundays at 20:00 UTC"
    steps:
      - uses: actions/checkout@v5

      - name: Prepare local environment
        run: |
          ./setup-local-certs.sh
          mkdir -p data/lib data/public data/backups data/auth data/practice
          printf '%s\n' "$TTYD_PASSWORD" | ./manage-players.sh add "$TTYD_USERNAME" --admin --password-stdin

      - name: Build and start the local stack
        run: docker compose -f docker-compose.local.yml up -d --build

      - name: Wait for the game container to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' conquer-local)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          exit 1

      - name: Web pages and authentication
        run: |
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          # The site's own sign-in (mod_auth_form): the form posts to /login/do
          # and the session cookie goes in a jar; prints "status redirect"
          signin() { curl -sk -c "$1" -b "$1" -o /dev/null -w '%{http_code} %{redirect_url}' --data-urlencode "httpd_username=$2" --data-urlencode "httpd_password=$3" --data-urlencode httpd_location=/play/ "${4:-https://localhost/login/do}"; }
          test "$(code https://localhost/)" = 200
          test "$(code https://localhost/game.html)" = 200
          test "$(code https://localhost/login.html)" = 200
          # Without a session Apache sends the visitor to the sign-in page
          test "$(code https://localhost/play/)" = 302
          test "$(curl -sk -o /dev/null -w '%{redirect_url}' https://localhost/play/)" = "https://localhost/login.html?next=/play/"
          rm -f /tmp/jar-ci /tmp/jar-bad /tmp/jar-long
          test "$(signin /tmp/jar-ci "$TTYD_USERNAME" "$TTYD_PASSWORD")" = "302 https://localhost/play/"
          test "$(code -b /tmp/jar-ci https://localhost/play/)" = 200
          # A wrong password goes back to the page, marked, and gives no session
          signin /tmp/jar-bad "$TTYD_USERNAME" wrong-password | grep -q '^302 https://localhost/login.html?failed=1'
          test "$(code -b /tmp/jar-bad https://localhost/play/)" = 302
          # The cookie: httponly, secure, same-site, no expiry (a browser
          # session) for the plain login and 30 days for "Remember me"
          grep -q '^#HttpOnly_localhost.*TRUE.*0.conquer_session' /tmp/jar-ci
          curl -sk -D- -o /dev/null --data-urlencode "httpd_username=$TTYD_USERNAME" --data-urlencode "httpd_password=$TTYD_PASSWORD" https://localhost/login/do | tr -d '\r' | grep -i '^set-cookie: conquer_session=' | grep -qi ';path=/;httponly;secure;samesite=lax$'
          curl -sk -D- -o /dev/null --data-urlencode "httpd_username=$TTYD_USERNAME" --data-urlencode "httpd_password=$TTYD_PASSWORD" https://localhost/login/long | tr -d '\r' | grep -i '^set-cookie: conquer_session=' | grep -q 'Max-Age=2592000;'
          test "$(signin /tmp/jar-long "$TTYD_USERNAME" "$TTYD_PASSWORD" https://localhost/login/long)" = "302 https://localhost/play/"
          test "$(code -b /tmp/jar-long https://localhost/play/)" = 200
          # A forged cookie, and a client-supplied identity header, do not get past Apache
          test "$(code -H 'Cookie: conquer_session=forged' https://localhost/play/)" = 302
          test "$(code -H "X-WEBAUTH-USER: $TTYD_USERNAME" https://localhost/play/)" = 302
          test "$(code -b /tmp/jar-bad -H "X-WEBAUTH-USER: $TTYD_USERNAME" https://localhost/play/)" = 302
          # A WebSocket opened by another site (or by no browser page) is
          # refused even with a session: no cross-site hijacking
          ws() { code -b /tmp/jar-ci -H 'Upgrade: websocket' -H 'Connection: Upgrade' "$@" https://localhost/play/ws; }
          test "$(ws -H 'Origin: https://evil.example')" = 403
          test "$(ws)" = 403
          # Signing out ends the session
          curl -sk -c /tmp/jar-long -b /tmp/jar-long -o /dev/null -w '%{http_code} %{redirect_url}\n' https://localhost/logout | grep -q '^30[27] https://localhost/login.html?loggedout=1'
          test "$(code -b /tmp/jar-long https://localhost/play/)" = 302
          # ttyd itself refuses requests that did not come through the proxy
          test "$(docker exec conquer-local curl -s -o /dev/null -w '%{http_code}' http://localhost:7681/play/)" = 407

      - name: No credentials in the container logs
        run: |
          if docker logs conquer-local 2>&1 | grep -iE "credential|$TTYD_PASSWORD"; then
            echo "Credentials leaked to the logs" >&2
            exit 1
          fi

      - name: Nation password tool (on a copy of the world)
        run: |
          docker exec -u conquer conquer-local sh -c '
            mkdir -p /tmp/pw && cp /opt/conquer/lib/data /tmp/pw/ &&
            printf "abcd12\n" | conqpasswd -d /tmp/pw god &&
            printf "zz12\n" | conqpasswd -d /tmp/pw sahara &&
            ! printf "abc\n" | conqpasswd -d /tmp/pw god 2>/dev/null &&
            ! printf "abcd\n" | conqpasswd -d /tmp/pw nosuchnation 2>/dev/null &&
            conqpasswd -d /tmp/pw -q god &&
            conqpasswd -d /tmp/pw -l god &&
            { conqpasswd -d /tmp/pw -q god; test $? = 3; } &&
            test "$(cmp -l /opt/conquer/lib/data /tmp/pw/data | wc -l)" -gt 0'

      - name: Shipped worlds have no usable nation password (only trainee)
        run: |
          # The game keeps seven characters of a DES hash in the world file;
          # a sample nation with a password could be guessed back from the
          # published world. Every nation of the nations files is locked.
          for w in lib practice-world; do
            dir=/opt/conquer/practice-world
            if [ "$w" = lib ]; then dir=/opt/conquer/default-world; fi
            for n in god $(grep -v '^#' "conquer/$w/nations" | awk 'NF{print $1}') trainee; do
              if [ "$n" = trainee ] && [ "$w" = lib ]; then continue; fi
              rc=0
              docker exec conquer-local conqpasswd -d "$dir" -q "$n" > /dev/null || rc=$?
              if [ "$n" = trainee ]; then expected=0; else expected=3; fi
              if [ "$rc" != "$expected" ]; then
                echo "$w/$n: conqpasswd -q gave $rc, expected $expected" >&2
                exit 1
              fi
            done
          done

      - name: Default world, owner fix and public status
        run: |
          test "$(docker exec conquer-local conqowner)" = 1000
          # The shipped world has god locked; the server sets its own
          docker exec conquer-local conqpasswd -q god && exit 1 || test $? = 3
          docker logs conquer-local 2>&1 | grep -q "god password is not set"
          docker exec conquer-local conquer -s | grep -q 'Turn 1'
          test "$(curl -sk https://localhost/status/status.json | jq .turn)" = 1
          test "$(curl -sk https://localhost/status/status.json | jq -r .schedule)" = "$TURN_SCHEDULE_LABEL"
          # Readable from other sites (the website on GitHub Pages)
          curl -skI https://localhost/status/status.json | grep -i '^access-control-allow-origin: \*'

      - name: Turn update
        run: |
          docker exec conquer-local conquer-turn --now
          docker exec conquer-local conquer -s | grep -q 'Turn 2'
          test "$(curl -sk https://localhost/status/status.json | jq .turn)" = 2
          test "$(curl -sk https://localhost/status/status.json | jq -r .turn_state.state)" = ok
          # The newspaper of turn 1 is published. The landing page list may
          # be empty: it leaves out the captured sectors, and a quiet first
          # turn has no other news
          test "$(curl -sk https://localhost/status/status.json | jq -r '.news | type')" = array
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/status/news/1.html)" = 200
          # Backups are private to the game user (uid 1000, not the runner)
          sudo sh -c 'ls data/backups/world_turn1_*.tar.gz &&
            test "$(stat -c %a data/backups)" = 700 &&
            test "$(stat -c %a data/backups/world_turn1_*.tar.gz)" = 600'

      - name: Early turn update once every nation is done
        run: |
          status() { curl -sk https://localhost/status/status.json | jq -c "$1"; }
          turn() { docker exec conquer-local conquer -s | sed -n 's/.*, Turn \([0-9]*\)$/\1/p'; }
          game() { docker exec -u conquer conquer-local "$@"; }
          # data/lib belongs to the game user (uid 1000), not to the runner
          for p in p1:anorian p2:fung; do
            printf '%s\n' player-password | sudo ./manage-players.sh add "${p%:*}" --nation "${p#*:}" --password-stdin
          done
          sudo ./manage-players.sh list
          game conquer-ready mark anorian
          game conquer-turn --if-ready
          test "$(turn)" = 2
          game conquer-status
          test "$(status .ready)" = '{"done":1,"total":2,"early":true}'
          game conquer-ready mark fung
          game conquer-turn --if-ready
          test "$(turn)" = 3
          test "$(game conquer-ready count)" = "0 2"
          test "$(status .ready.done)" = 0

      - name: Practice world template
        run: |
          # The menu's practice world: a copy of the template, playable and
          # with turns of its own
          docker exec -u conquer conquer-local sh -ec '
            rm -rf /tmp/p && cp -a /opt/conquer/practice-world /tmp/p
            cp /opt/conquer/share/help[0-5] /tmp/p/
            conqowner -d /tmp/p -s "$(id -u)" > /dev/null
            conquer -d /tmp/p -s | grep -q trainee
            conqrun -x -d /tmp/p > /dev/null
            conquer -d /tmp/p -s | grep -q "Turn 2"'

      - name: Player menu in English and Spanish
        run: |
          menu() { docker exec -u conquer -e TTYD_USER="$TTYD_USERNAME" conquer-local bash -c "printf q | conquer-menu $1"; }
          menu | grep -q ') Play'
          menu es | grep -q ') Jugar'
          # Only a known language is taken from the browser
          menu es-ES | grep -q ') Play'
          docker exec conquer-local cat /proc/1/cmdline | tr '\0' ' ' | grep -q -- '--url-arg'

      - name: Sign-up with an invite code
        run: |
          signup() { curl -sk -H 'Content-Type: application/json' -d "$1" https://localhost/join/api/signup; }
          test "$(curl -sk https://localhost/status/status.json | jq .signup)" = true
          code=$(sudo ./manage-players.sh invite 1 2>/dev/null)
          # A wrong code creates nothing
          signup '{"code":"ZZZZ-9999","account":"newbie","password":"newbie-pass"}' | jq -e '.error == "bad_code"'
          signup "{\"code\":\"$code\",\"account\":\"$TTYD_USERNAME\",\"password\":\"newbie-pass\"}" | jq -e '.error == "account_taken"'
          signup "{\"code\":\"$code\",\"account\":\"newbie\",\"password\":\"newbie-pass\"}" | jq -e '.ok'
          # The code works once
          signup "{\"code\":\"$code\",\"account\":\"newbie2\",\"password\":\"newbie-pass\"}" | jq -e '.error == "bad_code"'
          sudo grep -qx 'newbie:+' data/lib/.players
          ! sudo grep -q "$code" data/lib/.invites
          # The new account signs in, and the game has it found its nation
          curl -sk -c /tmp/jar-newbie -o /dev/null --data-urlencode httpd_username=newbie --data-urlencode httpd_password=newbie-pass https://localhost/login/do
          test "$(curl -sk -b /tmp/jar-newbie -o /dev/null -w '%{http_code}' https://localhost/play/)" = 200
          out=$(timeout 30 docker exec -u conquer -e TTYD_USER=newbie conquer-local bash -c "printf 'xx' | conquer-menu" || true)
          grep -q 'Found your nation' <<< "$out" || { echo "no nation builder for a new account: $out" >&2; exit 1; }
          sudo ./manage-players.sh remove newbie

      - name: Requests and approval
        run: |
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          ask() { curl -sk -H 'Content-Type: application/json' -d "$1" https://localhost/join/api/request; }
          # Sessions of the site's sign-in: the administrator's and a plain player's
          signin() { curl -sk -c "$1" -b "$1" -o /dev/null --data-urlencode "httpd_username=$2" --data-urlencode "httpd_password=$3" https://localhost/login/do; }
          rm -f /tmp/jar-admin /tmp/jar-asker /tmp/jar-asker2
          admin() { curl -sk -b /tmp/jar-admin -H 'Content-Type: application/json' "$@"; }
          test "$(curl -sk https://localhost/status/status.json | jq .requests_open)" = true
          test "$(curl -sk https://localhost/status/status.json | jq .last_join_turn)" = 5
          # A request without a code creates a pending account
          ask '{"account":"asker","password":"asker-pass","email":"asker@example.org","message":"Hi from CI","lang":"es"}' | jq -e '.ok and .status == "pending"'
          ask '{"account":"asker","password":"asker-pass"}' | jq -e '.error == "account_taken"'
          ask '{"account":"nomail","password":"asker-pass","email":"not an address"}' | jq -e '.ok == false'
          # Names read as an option or as a directory are refused
          for bad in .. . -v .hidden; do
            ask "{\"account\":\"$bad\",\"password\":\"asker-pass\"}" | jq -e '.error == "bad_account"'
          done
          ! sudo grep -qE '^(\.|-)' data/auth/htpasswd
          sudo grep -qx 'asker:?' data/lib/.players
          sudo grep -qP '^asker\t[0-9]+\tasker@example.org\tHi from CI\tes$' data/lib/.requests
          # The administrator page and its API need an administrator
          signin /tmp/jar-admin "$TTYD_USERNAME" "$TTYD_PASSWORD"
          signin /tmp/jar-asker asker asker-pass
          test "$(code https://localhost/admin/)" = 302
          test "$(code -b /tmp/jar-admin https://localhost/admin/)" = 200
          test "$(code https://localhost/admin/api/state)" = 302
          test "$(code -b /tmp/jar-asker https://localhost/admin/api/state)" = 403
          test "$(code -b /tmp/jar-asker -H 'Content-Type: application/json' -d '{"account":"asker"}' https://localhost/admin/api/approve)" = 403
          # A header sent by the client does not make anyone an administrator
          test "$(code -b /tmp/jar-asker -H "X-WEBAUTH-USER: $TTYD_USERNAME" https://localhost/admin/api/state)" = 403
          sudo ./manage-players.sh assign "$TTYD_USERNAME" --admin
          admin https://localhost/admin/api/state | jq -e '.ok and .last_join_turn == 5 and (.requests | map(.account) | index("asker") != null)'
          admin https://localhost/admin/api/state | jq -e '.requests | map(select(.account == "asker"))[0].lang == "es"'
          admin https://localhost/admin/api/state | jq -e '.players | map(select(.account == "asker" and .state == "?")) | length == 1'
          # Approving makes it a normal new account and empties the list
          admin -d '{"account":"asker"}' https://localhost/admin/api/approve | jq -e '.ok and .emailed == false'
          admin -d '{"account":"asker"}' https://localhost/admin/api/approve | jq -e '.error == "not_pending"'
          sudo grep -qx 'asker:+' data/lib/.players
          ! sudo grep -q '^asker' data/lib/.requests
          # Assigning: the state lists the world's nations; a nation of the world
          # (any case) is accepted, one that does not exist is refused
          admin https://localhost/admin/api/state | jq -e '.nations | map(select(.name == "anorian" and .race != null)) | length == 1'
          admin -d '{"account":"asker","nation":"nowhere"}' https://localhost/admin/api/assign | jq -e '.error == "no_nation"'
          admin -d '{"account":"asker","nation":"ANORIAN"}' https://localhost/admin/api/assign | jq -e '.ok and .assigned == "anorian"'
          sudo grep -qx 'asker:anorian' data/lib/.players
          admin https://localhost/admin/api/state | jq -e '.players | map(select(.account == "asker" and .state == "nation" and .nation == "anorian")) | length == 1'
          sudo ./manage-players.sh nations | grep -E '^anorian .*asker'
          sudo ./manage-players.sh list | grep -q 'Nations without an account'
          msg=$(sudo ./manage-players.sh assign asker nowhere 2>&1) && exit 1
          grep -q "no nation 'nowhere'" <<< "$msg" && grep -q anorian <<< "$msg"
          sudo ./manage-players.sh assign asker FUNG
          sudo grep -qx 'asker:fung' data/lib/.players
          admin -d '{"account":"asker"}' https://localhost/admin/api/assign | jq -e '.error == "bad_request"'
          admin -d '{"account":"asker","found":true}' https://localhost/admin/api/assign | jq -e '.ok'
          sudo grep -qx 'asker:+' data/lib/.players
          # Rejecting deletes the account
          ask '{"account":"asker2","password":"asker-pass"}' | jq -e '.status == "pending"'
          sudo grep -q '^asker2:' data/auth/htpasswd
          admin -d '{"account":"asker2"}' https://localhost/admin/api/reject | jq -e '.ok'
          ! sudo grep -q '^asker2' data/auth/htpasswd data/lib/.players data/lib/.requests
          signin /tmp/jar-asker2 asker2 asker-pass
          test "$(code -b /tmp/jar-asker2 https://localhost/play/)" = 302
          # Invite codes made from the page work for the sign-up tool
          invite=$(admin -d '{"count":1}' https://localhost/admin/api/invite | jq -er '.codes[0]')
          admin https://localhost/admin/api/state | jq -e --arg c "$invite" '.invites | index($c) != null'
          printf 'invited-pass\n' | docker exec -i -u conquer conquer-local conquer-signup invite "$invite" invited
          sudo grep -qx 'invited:+' data/lib/.players
          # Administrators can do the same from the server
          ask '{"account":"asker3","password":"asker-pass"}' | jq -e '.status == "pending"'
          sudo ./manage-players.sh requests | grep -q asker3
          sudo ./manage-players.sh approve asker3
          sudo grep -qx 'asker3:+' data/lib/.players
          for a in asker asker3 invited; do sudo ./manage-players.sh remove "$a"; done
          # Late join: approval is the only gate. The live world must keep its
          # turn for the steps below, so a copy of it is advanced past turn 5
          # (the same turn updates the game container runs, conqrun -x)
          late=/tmp/late-world
          docker exec -u conquer conquer-local sh -c "set -e; rm -rf $late; cp -a /opt/conquer/lib $late; rm -f $late/lock*; \
            conqowner -d $late -s \"\$(id -u)\" > /dev/null; \
            while [ \"\$(conquer -s -d $late | sed -n 's/.*, Turn //p')\" -lt 6 ]; do conqrun -x -d $late > /dev/null; done"
          docker exec -u conquer conquer-local conquer -s -d "$late" | grep -q 'Turn 6'
          # A code still makes an account, however late the game is
          invite=$(admin -d '{"count":1}' https://localhost/admin/api/invite | jq -er '.codes[0]')
          printf 'late2-pass\n' | docker exec -i -u conquer conquer-local conquer-signup invite "$invite" late2
          sudo grep -qx 'late2:+' data/lib/.players
          sudo ./manage-players.sh remove late2
          # The builder run for an approved account (conqrun -A) never asks for
          # god's password; -a still does. Nothing is typed, so the builder may
          # fail afterwards for lack of a name: only its output is checked
          out=$(printf '' | docker exec -i -u conquer conquer-local conqrun -a -d "$late" 2>&1 || true)
          grep -q 'what is conquer super user password' <<< "$out" || { echo "conqrun -a no longer asks for god's password: $out" >&2; exit 1; }
          out=$(printf '' | docker exec -i -u conquer conquer-local conqrun -A -d "$late" 2>&1 || true)
          ! grep -q 'what is conquer super user password' <<< "$out" || { echo "conqrun -A asked for god's password: $out" >&2; exit 1; }
          grep -q 'no super user password needed' <<< "$out"
          docker exec -u conquer conquer-local rm -rf "$late"

      - name: The nation builder still shows the coach's screens
        run: |
          python3 -m pip install --quiet pytest pyte
          python3 -m pytest -m game

      - name: Game runs as an unprivileged user
        run: |
          test "$(docker exec conquer-local stat -c %U /proc/1)" = conquer
          # Least privilege: no new privileges, and ttyd (pid 1) holds no capability
          docker inspect -f '{{.HostConfig.SecurityOpt}}' conquer-local | grep -q no-new-privileges
          test "$(docker exec conquer-local sed -n 's/^CapEff:[[:space:]]*//p' /proc/1/status)" = 0000000000000000
          test "$(stat -c %u data/lib/data)" = 1000

      - name: Scheduled turn update through cron
        env:
          TURN_SCHEDULE: "* * * * *"
        run: |
          docker compose -f docker-compose.local.yml up -d --force-recreate conquer
          for i in $(seq 1 50); do
            if docker logs conquer-local 2>&1 | grep -q 'Turn update completed, now turn 4'; then
              docker logs conquer-local 2>&1 | grep '^\[turn'
              exit 0
            fi
            sleep 3
          done
          docker logs conquer-local
          exit 1

      - name: Next turn time follows the schedule and time zone
        env:
          TZ: Europe/Madrid
          TURN_SCHEDULE: "0 20 * * 0"
          # Only the new container publishes this label; the previous one
          # (scheduled every minute) may still rewrite the status meanwhile
          TURN_SCHEDULE_LABEL: "Madrid schedule check"
        run: |
          status() { curl -sk https://localhost/status/status.json | jq -r "$1"; }
          docker compose -f docker-compose.local.yml up -d --force-recreate conquer
          for i in $(seq 1 30); do
            [ "$(status .schedule)" = "$TURN_SCHEDULE_LABEL" ] && break
            sleep 2
          done
          test "$(status .schedule)" = "$TURN_SCHEDULE_LABEL"
          next=$(status .next_turn)
          echo "next turn: $(date -d "@$next")"
          # Sunday (7) at 20:00 Madrid time
          test "$(date -d "@$next" +%u-%H:%M)" = "7-20:00"

      - name: A new season keeps the accounts and starts a new world
        run: |
          test "$(docker exec -u conquer conquer-local conquer -s | sed -n 's/.*, Turn //p')" != 1
          sudo ./manage-players.sh assign "$TTYD_USERNAME" fung
          sudo ./new-season.sh "Season CI" --yes
          test "$(docker exec -u conquer conquer-local conquer -s | sed -n 's/.*, Turn //p')" = 1
          sudo grep -qx "$TTYD_USERNAME:+" data/lib/.players
          ! sudo grep -v ':[+*]$' data/lib/.players
          curl -sk https://localhost/status/seasons/index.json | jq -e '.[0].name == "Season CI"'
          sudo sh -c 'ls backups/season-end-*/world.tgz'

      - name: Container logs
        if: always()
        run: docker compose -f docker-compose.local.yml logs --no-color

  # End-to-end rehearsal (tests/e2e/README.md): the smoke job's stack plus a
  # mail catcher, several players in parallel in browsers, bots playing turns,
  # and many sessions at once. Pull requests and manual runs: a short soak
  # (8 turns) and 10 sessions; nightly: 25 turns and 30 sessions.
  e2e:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 60 || 30 }}
    env:
      E2E_SOAK_TURNS: ${{ github.event_name == 'schedule' && '25' || '8' }}
      E2E_LOAD_SESSIONS: ${{ github.event_name == 'schedule' && '30' || '10' }}
      E2E_LOAD_SECONDS: ${{ github.event_name == 'schedule' && '120' || '60' }}
    steps:
      - uses: actions/checkout@v5

      - name: Test tools (Playwright, Chromium, pexpect)
        run: |
          python3 -m pip install --quiet -r tests/e2e/requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Staging up (local stack and mail catcher)
        run: |
          tests/e2e/up.sh --wipe-data
          cat tests/e2e/.run.env >> "$GITHUB_ENV"

      - name: Journey with several players in parallel
        run: python3 -m pytest tests/e2e/test_journey.py -v -s

      - name: Soak bots, season end, backup and restore
        run: python3 tests/e2e/soak.py

      - name: Load
        run: python3 tests/e2e/load.py

      - name: Container logs
        if: always()
        run: |
          mkdir -p test-results/e2e
          docker compose -f docker-compose.local.yml -f docker-compose.e2e.yml logs --no-color > test-results/e2e/docker.log 2>&1 || true

      - name: Results (traces, videos, screenshots, logs)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/e2e
          if-no-files-found: ignore
