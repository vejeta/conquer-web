# VPS-specific Docker Compose configuration
# This runs only the Conquer game container, using host Apache as reverse proxy

services:
  conquer:
    build:
      context: ./conquer
      args:
        # uid of the unprivileged game user; match the host user that owns
        # data/ so the backup scripts can read it without sudo
        CONQUER_UID: ${CONQUER_UID:-1000}
    container_name: conquer-vps
    environment:
      - MAX_CLIENTS=${MAX_CLIENTS:-5}
      - SESSION_TIMEOUT=${SESSION_TIMEOUT:-1800}
      - TTYD_FONT_SIZE=${TTYD_FONT_SIZE:-16}
      - TZ=${TZ:-UTC}
      - TURN_SCHEDULE=${TURN_SCHEDULE:-0 20 * * 0}
      - TURN_SCHEDULE_LABEL=${TURN_SCHEDULE_LABEL:-Weekly, Sundays at 20:00 UTC}
      - TURN_RETRY_MINUTES=${TURN_RETRY_MINUTES:-10}
      - TURN_MAX_RETRIES=${TURN_MAX_RETRIES:-18}
      - TURN_GRACE_MINUTES=${TURN_GRACE_MINUTES:-5}
      - TURN_BACKUPS=${TURN_BACKUPS:-10}
      - TURN_WEBHOOK_URL=${TURN_WEBHOOK_URL:-}
      - TURN_EARLY=${TURN_EARLY:-on}
      - JOIN_ACCOUNT=${JOIN_ACCOUNT:-}
      - JOIN_PASSWORD=${JOIN_PASSWORD:-}
      - ADMIN_CONTACT=${ADMIN_CONTACT:-}
    volumes:
      # Live world data: persists across rebuilds, seeded on first start
      - ./data/lib:/opt/conquer/lib
      # Automatic world backups taken before every turn update
      - ./data/backups:/opt/conquer/backups
      # Players' private practice worlds
      - ./data/practice:/opt/conquer/practice
      # Player accounts (the file host Apache checks), written when players
      # join with an invite code
      - ${HTPASSWD_FILE:-/etc/apache2/conquer-web.htpasswd}:/opt/conquer/auth/htpasswd
      # Public game status (status.json) served by Apache under /status/
      - ${STATUS_DIR:-./data/public}:/opt/conquer/public
    restart: unless-stopped
    ports:
      - "127.0.0.1:7681:7681"  # Only bind to localhost for security
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
