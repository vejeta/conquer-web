<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Try Conquer</title>
  <meta name="description" content="Play Conquer, the 1987 Usenet strategy game, right now in your browser: no account, nothing to install. A private practice world that runs on your own device.">
  <meta property="og:title" content="Try Conquer in your browser">
  <meta property="og:description" content="The 1987 Usenet strategy game, compiled to WebAssembly. No account, nothing to install.">
  <link rel="stylesheet" href="../vendor/xterm/xterm.css">
  <link rel="stylesheet" href="../theme.css">
  <link rel="stylesheet" href="../touch.css">
  <script src="../race.js"></script>
</head>
<body class="game-page">
  <div class="moves-panel" id="moves-panel" hidden role="dialog" aria-modal="true">
    <div class="card panel"><div data-moves></div><button class="key key-primary ok" id="moves-ok" type="button" data-i18n="try.moves_ok">Got it</button></div>
  </div>
  <header class="site-header mountains" id="site-header">
    <a class="site-name" href="../" id="home">Conquer</a>
    <span class="try-note" id="note" data-i18n="try.note">Practice world on your device · nation <b>trainee</b>, password <b>train1</b></span>
    <span class="spacer"></span>
    <nav class="nav" aria-label="Game">
      <button class="key key-small" id="coach-toggle" type="button" aria-controls="coach" aria-expanded="false" title="Step-by-step help for your first turn" data-i18n-title="coach.toggle_title">Coach</button>
      <button class="key key-small" id="turn" type="button" title="Run the turn update of your practice world" data-i18n-title="try.turn_title" data-i18n="try.turn" hidden>Next turn</button>
      <button class="key key-small" id="reset" type="button" title="Delete your practice world and start again" data-i18n-title="try.reset_title" data-i18n="try.reset">Start over</button>
      <button class="key key-small" id="moves-toggle" type="button" aria-controls="moves-panel" data-i18n="try.moves">How to move</button>
      <button class="key key-small" id="toggle-keys" type="button" aria-controls="touch-ui" aria-expanded="true" data-i18n="try.toggle_keys">Keys</button>
    </nav>
  </header>

  <main class="game-main">
    <div class="stage">
      <div class="gamescreen"><div class="gs" id="gs">
        <div class="stone" id="stone">
          <span class="roll l"></span><span class="roll r"></span><span class="slit"></span>
          <div class="arch" aria-hidden="true"><i class="lintel"></i><i class="sill"></i><i class="col l"></i><i class="col r"></i><i class="cor tl"></i><i class="cor tr"></i><i class="cor bl b"></i><i class="cor br b"></i></div>
          <div class="runes" aria-hidden="true">ᛈᛖᛞᛟ ᛗᛖᛚᛚᛟᚾ ᚨ ᛗᛁᚾᚾᛟ</div>
          <div class="terminal">
            <div class="touch-viewport" id="touch-viewport"><div class="touch-stage" id="touch-stage"><div id="terminal"></div></div></div>
          </div>
        </div>
      </div></div>
      <aside class="coach panel" id="coach" hidden aria-live="polite">
        <div class="head"><span id="coach-count"></span><button class="close" id="coach-close" type="button" title="Close the coach" data-i18n-title="coach.close_title">&times;</button></div>
        <div class="bar"><span id="coach-progress"></span></div>
        <h2 id="coach-title"></h2>
        <div class="press" id="coach-keys"></div>
        <div id="coach-text"></div>
        <div class="nav">
          <button id="coach-back" type="button" data-i18n="coach.back">Back</button>
          <button id="coach-next" type="button">Next</button>
        </div>
        <p class="auto" data-i18n="coach.auto">The coach moves on by itself when the game shows the next screen. Tap a key above to press it.</p>
      </aside>
    </div>
  </main>

<script src="../vendor/xterm/xterm.js"></script>
<script src="../vendor/xterm/addon-fit.js"></script>
<script src="conquer.js"></script>
<script src="conqrun.js"></script>
<script src="../site.js"></script>
<script src="../coach.js"></script>
<script src="../arrows.js"></script>
<script src="../moves.js"></script>
<script src="../audio.js"></script>
<script src="../touch.js"></script>
<script src="../appbar.js"></script>
<script>
  (function () {
    // The world lives in the browser (IndexedDB), under /conquer/lib, where
    // the game was compiled to look for it
    var LIB = '/conquer/lib';
    var NATION = 'trainee';

    // Texts: i18n/<language>.json, "try" (site.js). {b} bold, {d} dim,
    // {g} green, {r} back to normal
    var ANSI = { b: '\x1b[1m', d: '\x1b[2m', g: '\x1b[32m', r: '\x1b[0m' };
    function T(key) { return conquerI18n.t('try.' + key, ANSI).replace(/\n/g, '\r\n'); }

    var term = new Terminal({ cols: 80, rows: 24, fontSize: 16, cursorBlink: true,
      fontFamily: 'ui-monospace, "DejaVu Sans Mono", Menlo, monospace',
      theme: conquerRace.terminal(false) });
    var fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('terminal'));
    window.term = term;

    // Conquer needs 80x24: shrink the font until the terminal fits it
    function fitScreen() {
      var size = 18;
      term.options.fontSize = size;
      var dims = fit.proposeDimensions();
      while (dims && (dims.cols < 80 || dims.rows < 24) && size > 7) {
        term.options.fontSize = --size;
        dims = fit.proposeDimensions();
      }
      term.resize(80, 24);
    }
    window.addEventListener('resize', fitScreen);
    fitScreen();

    // ?autostart=1 (the app passes it): the game starts at once, types the
    // practice password and goes past the title, so that the first thing
    // seen is the map. The coach and "How to move" open only when asked.
    var autostart = new URLSearchParams(location.search).get('autostart') === '1';
    var autoPlaying = false;

    var running = null;       // the module that has the keyboard
    function send(data) {
      if (!running) { if (data === ' ' || data === '\r') start(); return; }
      for (var i = 0; i < data.length; i++) running.conquerKeys.push(data.charCodeAt(i));
    }
    term.onData(send);
    conquerArrows(term, send);

    // The touch layer (touch.js): taps on the map, command chips, d-pad,
    // zoom. "Keys" shows or hides its bar.
    var touch = conquerTouch({ term: function () { return term; }, send: send, host: document.getElementById('terminal'),
      lang: conquerLang(), relayout: fitScreen,
      skipKeyboard: function () { return autoPlaying; },
      gs: document.getElementById('gs'), stone: document.getElementById('stone') });
    window.touchLayer = touch;
    var toggleKeys = document.getElementById('toggle-keys');
    toggleKeys.setAttribute('aria-expanded', String(touch.barShown()));
    toggleKeys.addEventListener('click', function () {
      toggleKeys.setAttribute('aria-expanded', String(touch.toggleBar()));
    });

    // Output of the game goes straight to the terminal (newline -> CR LF
    // outside the game screen, which positions the cursor itself)
    function output(c) {
      term.write(c === 10 ? '\r\n' : String.fromCharCode(c));
    }

    var seed = null;
    function fetchSeed() {
      if (seed) return Promise.resolve(seed);
      return fetch('world/files.json').then(function (r) { return r.json(); }).then(function (names) {
        return Promise.all(names.filter(function (f) { return f !== 'files.json'; }).map(function (f) {
        return fetch('world/' + f).then(function (r) {
          if (!r.ok) throw new Error(f);
          return r.arrayBuffer();
        }).then(function (b) { return [f, new Uint8Array(b)]; });
      }));
      }).then(function (files) { seed = files; return files; });
    }

    // Mount the saved world (IndexedDB) and plant the practice world the
    // first time
    function prepare(M, fresh) {
      return new Promise(function (resolve, reject) {
        M.FS.mkdir('/conquer'); M.FS.mkdir(LIB); M.FS.mkdir('/conquer/bin');
        M.FS.mount(M.IDBFS, {}, LIB);
        M.FS.syncfs(true, function (err) {
          if (err) return reject(err);
          var have = false;
          try { M.FS.stat(LIB + '/data'); have = true; } catch (e) {}
          if (have && !fresh) return resolve();
          fetchSeed().then(function (files) {
            M.FS.readdir(LIB).forEach(function (f) { if (f !== '.' && f !== '..') M.FS.unlink(LIB + '/' + f); });
            files.forEach(function (f) { M.FS.writeFile(LIB + '/' + f[0], f[1]); });
            M.FS.writeFile(LIB + '/.userlog', '');
            M.FS.syncfs(false, function (e) { e ? reject(e) : resolve(); });
          }, reject);
        });
      });
    }

    function save(M) {
      return new Promise(function (resolve) { M.FS.syncfs(false, function () { resolve(); }); });
    }

    function launch(factory, args, fresh) {
      var M;
      return new Promise(function (done) {
        factory({
          conquerKeys: [],
          noExitRuntime: false,
          preRun: [function (mod) { mod.FS.init(null, output, output); }],
          onExit: function () { save(M).then(done); },
          print: function (s) { term.write(s + '\r\n'); },
          printErr: function (s) { term.write(s + '\r\n'); }
        }).then(function (mod) {
          M = mod;
          return prepare(M, fresh);
        }).then(function () {
          running = M;
          M.callMain(args);
        }).catch(function (e) {
          term.write('\r\n\x1b[31m' + T('failed') + ' ' + e + '\x1b[0m\r\n');
          done();
        });
      }).then(function () { running = null; });
    }

    function menu(message) {
      term.write('\x1b[0m\x1b[H\x1b[2J');
      term.write('\r\n  \x1b[1;32mConquer\x1b[0m  \x1b[2m' + T('subtitle') + '\x1b[0m\r\n\r\n');
      if (message) term.write('  ' + message + '\r\n\r\n');
      term.write(T('intro'));
      touch.setMode('start');       // before the game runs: one chip, Play
      document.getElementById('turn').hidden = false;
      // Keys go to the game, not to the button that was just pressed
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      term.focus();
    }

    // How to move (moves.js): opened by itself the first time a game starts
    var movesPanel = document.getElementById('moves-panel');
    function showMoves(show) {
      movesPanel.hidden = !show;
      if (show) { movesPanel.querySelector('.card').scrollTop = 0; document.getElementById('moves-ok').focus({ preventScroll: true }); }
      else term.focus();
    }
    document.getElementById('moves-toggle').addEventListener('click', function () { showMoves(true); });
    document.getElementById('moves-ok').addEventListener('click', function () { showMoves(false); });
    movesPanel.addEventListener('click', function (e) { if (e.target === movesPanel) showMoves(false); });
    movesPanel.addEventListener('keydown', function (e) { if (e.key === 'Escape') showMoves(false); });

    function start() {
      if (running) return;
      touch.setMode(null);
      var seen = false;
      try { seen = localStorage.getItem('conquer-moves-seen') === '1'; localStorage.setItem('conquer-moves-seen', '1'); } catch (e) {}
      if (!seen && !autostart) setTimeout(function () { showMoves(true); }, 800);
      term.focus();
      term.write('\x1b[H\x1b[2J');
      if (autostart) autoplay();
      launch(createConquer, ['-n', NATION]).then(function () { autoPlaying = false; menu(T('saved')); });
    }

    function screenText() {
      var b = term.buffer.active, out = [];
      for (var y = 0; y < term.rows; y++) {
        var l = b.getLine(b.viewportY + y);
        out.push(l ? l.translateToString(true) : '');
      }
      return out.join('\n');
    }

    // Types the password when the game asks for it and presses a key at the
    // title, until the map shows (or 60 s pass)
    function autoplay() {
      var typed = false, up = false, t0 = Date.now();
      autoPlaying = true;
      var iv = setInterval(function () {
        if (running) up = true;
        if ((up && !running) || Date.now() - t0 > 60000) { clearInterval(iv); autoPlaying = false; return; }
        var text = screenText();
        if (!typed) {
          if (/Password:/i.test(text)) { typed = true; send('train1\r'); }
        } else if (/PRESS ANY KEY/i.test(text)) {
          send(' ');
        } else if (touch.where() === 'map') {
          clearInterval(iv); autoPlaying = false;
        }
      }, 300);
    }

    document.getElementById('turn').addEventListener('click', function () {
      if (running) return;
      touch.setMode(null);
      term.write('\x1b[0m\x1b[H\x1b[2J  ' + T('running') + '\r\n\r\n');
      launch(createConqrun, ['-x']).then(function () { menu(T('new_turn')); });
    });

    // Two taps, so a stray one does not delete the world
    var resetButton = document.getElementById('reset'), armed = null;
    resetButton.addEventListener('click', function () {
      if (running) return;
      if (!armed) {
        resetButton.textContent = T('confirm');
        armed = setTimeout(function () { armed = null; resetButton.textContent = T('reset'); }, 4000);
        return;
      }
      clearTimeout(armed); armed = null; resetButton.textContent = T('reset');
      term.write('\x1b[H\x1b[2J  ' + T('starting') + '\r\n');
      createConquer({ noExitRuntime: true, preRun: [function (mod) { mod.FS.init(null, output, output); }] })
        .then(function (M) { return prepare(M, true); })
        .then(function () { menu(T('ready')); });
    });

    // The coach of the tutorial, next to the terminal
    conquerCoach(function () { return term; }, fitScreen, '../tutorial/first-turn.json');

    conquerI18n.ready().then(function () {
      document.title = T('title');
      menu();
      term.focus();
      if (autostart) start();
    });
  })();
</script>
</body>
</html>
