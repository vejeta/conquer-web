<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="hall.page_title">Conquer Hall of Fame</title>
  <meta name="description" content="The rulers who won the seasons of Conquer, the classic multiplayer strategy game.">
  <meta property="og:title" content="Conquer Hall of Fame">
  <meta property="og:description" content="The rulers who won the seasons of Conquer, the 1987 Usenet strategy game back in the browser.">
  <link rel="stylesheet" href="theme.css">
  <script src="race.js"></script>
  <style>
    /* Layout only: colours and fonts come from theme.css */
    .seasons { display: flex; flex-direction: column; gap: var(--s4); }
    .season h2 { margin: 0; }
    .meta { color: var(--ink-dim); font-size: .9rem; margin: 2px 0 var(--s4); font-variant-numeric: tabular-nums; }
    .podium { list-style: none; margin: 0 0 var(--s3); padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3); }
    .podium li { background: var(--bg); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: var(--radius); padding: var(--s3); }
    .podium .place { font: 1.15rem/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--c); }
    .podium .name { font: 1.7rem/1.1 var(--font-mono); color: var(--ink); }
    .podium .detail { color: var(--ink-dim); font-size: .85rem; }
    details summary { cursor: pointer; color: var(--ink-dim); font-size: .9rem; min-height: 44px; display: flex; align-items: center; }
    .empty { color: var(--ink-dim); }
  </style>
</head>
<body>
<header class="site-header mountains">
  <a class="site-name" href="index.html">Conquer</a>
  <span class="spacer"></span>
  <nav class="nav" aria-label="Main">
    <a class="key key-small" href="game.html" data-server-link="game.html"><span data-i18n="nav.play">Play</span></a>
    <a class="key key-small" href="hall.html"><span data-i18n="nav.hall">Hall</span></a>
    <a class="key key-small" href="signup.html" data-server-link="signup.html"><span data-i18n="nav.join">Join</span></a>
  </nav>
  <select class="select" data-lang-menu aria-label="Language" data-i18n-title="index.language"></select>
</header>
<main class="page">
  <h1 data-i18n="hall.title">Hall of fame</h1>
  <p class="lede" data-i18n="hall.lede">Every season of Conquer on this server, and the rulers who ended it on top.</p>
  <div id="seasons" class="seasons"><p class="empty" data-i18n="hall.empty">The first season is still being fought. Its winners will be written here.</p></div>
</main>
<footer class="site-footer mountains">
  <p data-i18n="index.footer">Conquer is free software (GPL-3.0-or-later). Source: <a href="https://github.com/vejeta/conquer">game</a> &middot; <a href="https://github.com/vejeta/conquer-web">web server</a></p>
  <div class="foot-links"><a href="design.html" data-i18n="nav.design">Design</a> <a href="privacy.html" data-i18n-page="privacy" data-i18n="nav.privacy">Privacy</a></div>
</footer>
<script src="server.js"></script>
<script src="site.js"></script>
<script>
  (function () {
    var box = document.getElementById('seasons');
    function T(key, params) { return conquerI18n.t('hall.' + key, params); }
    var PLACES = [['first', '--gold'], ['second', '--ink'], ['third', '--stone']];
    function add(parent, tag, cls, text) {
      var e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text != null) e.textContent = text;
      parent.appendChild(e);
      return e;
    }
    function render(s) {
      var nations = (s.final.nations || []).slice().sort(function (a, b) { return b.score - a.score; });
      var sec = add(box, 'section', 'season panel');
      add(sec, 'h2', null, s.name);
      add(sec, 'p', 'meta', T('ended', { date: s.ended, season: s.final.season || '', turn: s.final.turn }));
      var podium = add(sec, 'ol', 'podium');
      nations.slice(0, 3).forEach(function (n, i) {
        var li = add(podium, 'li');
        li.style.setProperty('--c', 'var(' + PLACES[i][1] + ')');
        add(li, 'div', 'place', T(PLACES[i][0]));
        add(li, 'div', 'name', n.name);
        add(li, 'div', 'detail', T('detail', { race: n.race, 'class': n['class'], score: n.score }));
      });
      var det = add(sec, 'details');
      add(det, 'summary', null, T('all_scores', { n: nations.length }));
      var wrap = add(det, 'div', 'table-wrap');
      var table = add(wrap, 'table', 'table');
      var head = add(add(table, 'thead'), 'tr');
      ['#', T('nation'), T('race'), T('class'), T('score')].forEach(function (h, i) { add(head, 'th', i === 0 || i === 4 ? 'num' : null, h); });
      var body = add(table, 'tbody');
      nations.forEach(function (n, i) {
        var tr = add(body, 'tr');
        add(tr, 'td', 'num', i + 1); add(tr, 'td', null, n.name); add(tr, 'td', null, n.race);
        add(tr, 'td', null, n['class']); add(tr, 'td', 'num', n.score);
      });
    }
    conquerI18n.ready().then(function () { return fetch(conquerServerUrl('status/seasons/index.json'), { cache: 'no-store' }); })
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (list) {
        if (!list.length) return;
        return Promise.all(list.map(function (s) {
          return fetch(conquerServerUrl('status/seasons/' + encodeURIComponent(s.slug) + '.json')).then(function (r) { return r.json(); });
        })).then(function (seasons) { shown = seasons; draw(); });
      })
      .catch(function () { /* no finished season yet */ });
    // Seasons drawn in the language chosen in the menu
    var shown = null;
    function draw() { box.textContent = ''; shown.forEach(render); }
    document.addEventListener('conquer:lang', function () { if (shown) draw(); });
  })();
</script>
</body>
</html>
