#
# fail2ban filter for wrong passwords on the site's sign-in form.
#
# mod_auth_form answers a wrong password with a redirect to
# /login.html?failed=1 and writes nothing the stock apache-auth filter knows,
# so the virtual host logs the sign-in posts in their own file
# (conquer_login.log, LogFormat conquer_login in vps/virtualhost.conf.template):
#
#   203.0.113.9 - - [04/Nov/2026:10:00:00 +0000] "POST /login/do?next=%2Fplay%2F HTTP/1.1" 302 "/login.html?failed=1&next=%2Fplay%2F"
#
# (fail2ban cuts the time out of the line, so the brackets may be empty: [^\]]*)
#
# A good sign-in redirects to /play/ (or the page it came from) and does not match.

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /login/(?:do|long)(?:\?[^"\s]*)? HTTP/[0-9.]+" 302 "[^"]*login\.html\?failed=1[^"]*"\s*$

ignoreregex =
