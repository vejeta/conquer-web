#
# fail2ban filter for wrong recovery codes and wrong current passwords at
# the account endpoints (web/recover.html, web/account.html).
#
# The gate answers a wrong code or a wrong current password with HTTP 403
# (a good one gets 200, too many tries 429), and the virtual host logs the
# posts to these endpoints in conquer_recover.log with the same format as
# the sign-in log (vps/virtualhost.conf.template):
#
#   203.0.113.9 - - [04/Nov/2026:10:00:00 +0000] "POST /join/api/recover HTTP/1.1" 403 "-"
#
# (fail2ban cuts the time out of the line, so the brackets may be empty: [^\]]*)

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]*\] "POST /(?:join/api/recover|account/api/(?:password|recovery)) HTTP/[0-9.]+" 403 "[^"]*"\s*$

ignoreregex =
